:root{--mint:#76dfc0;--gold:#e7a85e;--ink:#eef6f4;--panel:rgba(7,18,20,.91)}*{box-sizing:border-box}html,body,#globe,#map2d{width:100%;height:100%;margin:0}body{overflow:hidden;background:#050b0e;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}#globe,#map2d{position:absolute;inset:0}#map2d{display:none;background:#111c1f}.shade{position:absolute;z-index:400;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(3,9,11,.88),transparent 37%,transparent 75%,rgba(3,9,11,.24)),linear-gradient(0deg,rgba(3,9,11,.5),transparent 40%)}.brand{position:absolute;z-index:700;left:25px;top:23px;display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(118,223,192,.7);border-radius:12px;color:var(--mint);background:#081719d9;font:600 15px monospace;box-shadow:0 0 30px #55cda51b}.brand div{display:flex;flex-direction:column}.brand strong{font-size:15px}.brand small{margin-top:4px;color:#80938f;font:8px monospace;letter-spacing:.14em;text-transform:uppercase}.rail{position:absolute;z-index:700;left:22px;top:92px;width:196px;padding:11px;border:1px solid #d8efea20;border-radius:16px;background:rgba(5,15,17,.82);box-shadow:0 18px 55px #0006;backdrop-filter:blur(15px)}.rail-title{padding:4px 8px 11px;color:#78908b;font:8px monospace;letter-spacing:.13em;text-transform:uppercase}.rail button{position:relative;width:100%;min-height:52px;margin:3px 0;padding:7px 10px;display:grid;grid-template-columns:31px 1fr;align-items:center;gap:9px;border:1px solid transparent;border-radius:10px;color:#aabbb8;background:transparent;text-align:left;cursor:pointer;transition:.2s}.rail button:hover{color:#eef7f5;background:#ffffff0b}.rail button.active{color:#eef9f6;border-color:#76dfc04a;background:linear-gradient(90deg,#76dfc022,#ffffff08);box-shadow:inset 2px 0 var(--mint)}.rail button>i{width:30px;height:30px;display:grid;place-items:center;border:1px solid #d9ebe725;border-radius:8px;color:#87a09b;background:#f tom:9px;color:#bdcdca;font:8px monospace;text-transform:uppercase}.legend>i{display:block;height:7px;border-radius:4px;background:linear-gradient(90deg,#265e78,#36a99a,#eed45e,#ef7a34,#b62838)}.legend.uncertainty>i{background:linear-gradient(90deg,#245f99,#38afaf,#dec649,#de623d,#9b256e)}.legend div{display:flex;justify-content:space-between;margin-top:5px;color:#718784;font:7px monospace}.legend.globe{display:none}.coords{position:absolute;z-index:700;left:244px;top:31px;color:#79d9be;font:9px monospace}.mine{padding:8px 11px!important;border:1px solid #ffffffcc!important;border-radius:7px!important;color:#fff!important;background:#591a12f2!important;box-shadow:0 8px 24px #0007!important;font:11px monospace!important}.mine strong{display:block;font-size:12px}.mine small{display:block;margin-top:3px;color:#ffc8a9;font-size:8px}.mine:before{border-top-color:#591a12f2!important}.leaflet-control-zoom a{color:#e2ecea!important;background:#071214dc!important;border-color:#ffffff24!important}.leaflet-control-scale-line{color:#d6e1df!important;border-color:#d6e1df!important;background:#07121499!important}.leaflet-control-attribution{color:#748683!important;background:#071214bb!important}.leaflet-control-attribution a{color:#9aaba8!important}.cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer,.cesium-viewer-fullscreenContainer{display:none!important}.cesium-widget-credits{opacity:.38;transform:scale(.72);transform-origin:right bottom}.fallback{display:none;position:absolute;z-index:650;inset:0;place-items:center;background:radial-gradient(circle at 55% 45%,#1d3538,#050b0e 65%);color:#8fa5a1;font:10px monospace}
@media(max-width:760px){.brand{left:14px;top:13px}.brand small,.coords{display:none}.mode-badge{right:12px;top:13px}.rail{left:9px;top:auto;bottom:10px;width:calc(100vw - 18px);padding:7px;display:flex;gap:4px;overflow:auto}.rail-title{display:none}.rail button{flex:0 0 69px;min-height:50px;margin:0;padding:5px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:3px}.rail button>i{width:23px;height:23px;margin:auto;font-size:11px}.rail button strong{font-size:8px}.rail button small{display:none}.rail .tour{margin-top:0}.story{left:13px;bottom:82px;width:calc(100vw - 26px);padding:20px}.story h1{font-size:34px}.legend{display:none}}
</style></head><body><div id="globe"></div><div id="map2d"></div><div class="fallback" id="fallback">3D globe unavailable — switch to Study area</div><div class="shade"></div><header class="brand"><span class="mark">G3</span><div><strong>GeoHybridGNN</strong><small>3D research atlas · version 3</small></div></header><nav class="rail" id="rail"><div class="rail-title">Explore the research</div></nav><section class="story" id="story"></section><aside class="legend globe" id="legend"><strong>Prospectivity probability</strong><i></i><div><span>Low</span><span>High</span></div></aside><div class="coords" id="coords">Interactive 3D Earth · drag to rotate</div><div class="mode-badge"><i></i><span id="mode">3D globe view</span></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.126.0/Build/Cesium/Cesium.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const root='/GeoHybridGNN/',bounds=[[25.984817,59.999735],[32.000057,68.003885]];const scenes=[['globe','◎','3D Globe','Global setting','Explore Earth in true 3D and locate Pakistan within the global metallogenic context.'],['study','⌖','Study Area','Western Chagai Belt','Move from the globe into the 30 m analysis grid covering the western Chagai porphyry copper belt.'],['evidence','≋','Geology','Integrated evidence','Read lithology, faults, tectonic units and known copper occurrences as one geological system.'],['prediction','◈','Prediction','Prospectivity surface','Explore the ensemble-mean probability surface produced by GeoHybridGNN.'],['uncertainty','◌','Uncertainty','Prediction confidence','Inspect fold-wise variability and distinguish stable targets from uncertain areas.'],['targets','◆','Mine Targets','Reko Diq and Saindak','Finish at the two key Cu–Au mine references, with clear persistent labels at every zoom level.']];
let viewer,spin=true;try{Cesium.buildModuleUrl.setBaseUrl('https://cdn.jsdelivr.net/npm/cesium@1.126.0/Build/Cesium/');const osm=new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap contributors',maximumLevel:19});viewer=new Cesium.Viewer('globe',{baseLayer:new Cesium.ImageryLayer(osm),terrainProvider:new Cesium.EllipsoidTerrainProvider(),animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,shouldAnimate:true});viewer.scene.globe.enableLighting=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#050b0e');viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(55,24,12500000),orientation:{heading:0,pitch:-Cesium.Math.PI_OVER_TWO,roll:0}});viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(64.2,29.2,120000),point:{pixelSize:13,color:Cesium.Color.fromCssColorString('#76dfc0'),outlineColor:Cesium.Color.WHITE,outlineWidth:2},label:{text:'PAKISTAN · WESTERN CHAGAI',font:'12px monospace',fillColor:Cesium.Color.WHITE,showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#071719cc'),pixelOffset:new Cesium.Cartesian2(0,-28),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,16000000)}});viewer.clock.onTick.addEventListener(()=>{if(spin&&current==='globe')viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z,-0.00018)});viewer.screenSpaceEventHandler.setInputAction(()=>spin=false,Cesium.ScreenSpaceEventType.LEFT_DOWN)}catch(e){document.querySelector('#fallback').style.display='grid'}
const map=L.map('map2d',{zoomControl:false,minZoom:2,maxZoom:12,worldCopyJump:true}).setView([29,64],5);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri · Data © OpenStreetMap',maxZoom:19}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{attribution:'© CARTO',maxZoom:19}).addTo(map);L.control.zoom({position:'topright'}).addTo(map);L.control.scale({imperial:false,position:'bottomright'}).addTo(map);const layers={prediction:L.imageOverlay(root+'data/prospectivity.png',bounds,{opacity:.84}),uncertainty:L.imageOverlay(root+'data/uncertainty.png',bounds,{opacity:.87}),geology:L.imageOverlay(root+'data/lithology-overlay.png',bounds,{opacity:.79})};async function geo(name,file,options){try{const r=await fetch(root+'data/'+file);layers[name]=L.geoJSON(await r.json(),options)}catch(e){console.warn(name,e)}}Promise.all([geo('faults','faults.geojson',{style:{color:'#ff7969',weight:1.4,opacity:.95}}),geo('tectonics','tectonics.geojson',{style:{color:'#efbd77',weight:1.2,opacity:.8,fillOpacity:0}}),geo('boundary','pakistan.geojson',{style:{color:'#f1f5f4',weight:1.5,opacity:.8,fillOpacity:0}}),geo('copper','copper.geojson',{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#fff',weight:1.2,fillColor:'#ef634f',fillOpacity:1})})]);[[29.1333,62.0333,'Reko Diq','Cu–Au mine'],[29.27039,61.56389,'Saindak','Cu–Au mine']].forEach(s=>L.circleMarker([s[0],s[1]],{radius:8,color:'#fff',weight:2.5,fillColor:'#ff674f',fillOpacity:1}).bindTooltip('<strong>'+s[2]+'</strong><small>'+s[3]+'</small>',{permanent:true,direction:'top',offset:[0,-11],className:'mine'}).addTo(map));
let current='globe',tour=false,timers=[];const rail=document.querySelector('#rail'),story=document.querySelector('#story'),legend=document.querySelector('#legend');rail.innerHTML+='<div id="buttons">'+scenes.map(s=>'<button data-scene="'+s[0]+'"><i>'+s[1]+'</i><span><strong>'+s[2]+'</strong><small>'+s[3]+'</small></span></button>').join('')+'<button class="tour" id="tour"><i>▶</i><span><strong>Guided Tour</strong><small>Play all research steps</small></span></button></div>';
function show(key){current=key;const isGlobe=key==='globe';document.querySelector('#globe').style.display=isGlobe?'block':'none';document.querySelector('#map2d').style.display=isGlobe?'none':'block';document.querySelector('#mode').textContent=isGlobe?'3D globe view':'2D scientific map';document.querySelector('#coords').textContent=isGlobe?'Interactive 3D Earth · drag to rotate':'29.13° N · 62.03° E';legend.className='legend '+key;if(!isGlobe){setTimeout(()=>map.invalidateSize(),40);Object.values(layers).forEach(l=>map.hasLayer(l)&&map.removeLayer(l));const add=(...n)=>n.forEach(x=>layers[x]&&layers[x].addTo(map));if(key==='study'){add('boundary');map.flyToBounds(bounds,{padding:[65,65],duration:1.6})}if(key==='evidence'){add('geology','tectonics','faults','boundary','copper');map.flyToBounds(bounds,{padding:[45,45],duration:1.6})}if(key==='prediction'){add('prediction','faults','boundary','copper');map.flyToBounds(bounds,{padding:[45,45],duration:1.6})}if(key==='uncertainty'){add('uncertainty','faults','boundary','copper');map.flyToBounds(bounds,{padding:[45,45],duration:1.6})}if(key==='targets'){add('prediction','faults','boundary','copper');map.flyTo([29.18,61.82],8,{duration:1.6})}}else if(viewer){spin=true;viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(55,24,12500000),duration:1.8})}const i=scenes.findIndex(s=>s[0]===key),s=scenes[i];story.style.animation='none';story.offsetHeight;story.style.animation='';story.innerHTML='<p>GeoHybridGNN · Scene '+String(i+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0')+'</p><h1>'+s[3]+'</h1><span>'+s[4]+'</span><div class="progress"><i style="width:'+((i+1)/scenes.length*100)+'%"></i></div>';document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===key))}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{stop();show(b.dataset.scene)});function stop(){tour=false;timers.forEach(clearTimeout);timers=[];const b=document.querySelector('#tour');b.classList.remove('active');b.innerHTML='<i>▶</i><span><strong>Guided Tour</strong><small>Play all research steps</small></span>'}document.querySelector('#tour').onclick=()=>{if(tour)return stop();tour=true;const b=document.querySelector('#tour');b.classList.add('active');b.innerHTML='<i>Ⅱ</i><span><strong>Pause Tour</strong><small>Stop automatic playback</small></span>';scenes.forEach((s,i)=>timers.push(setTimeout(()=>{show(s[0]);if(i===scenes.length-1)stop()},i*3800)))};map.on('mousemove',e=>{if(current!=='globe')document.querySelector('#coords').textContent=e.latlng.lat.toFixed(3)+'° N · '+e.latlng.lng.toFixed(3)+'° E'});show('globe');
</script></body></html>
