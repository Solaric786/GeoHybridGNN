*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{overflow:hidden;background:#071012;color:#eef7f5;font-family:Inter,Segoe UI,Arial,sans-serif}#map{position:absolute;inset:0;background:#142123}.shade{position:absolute;z-index:400;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(3,10,12,.86),transparent 34%,transparent 72%,rgba(3,10,12,.25)),linear-gradient(0deg,rgba(3,9,11,.6),transparent 38%)}.brand{position:absolute;z-index:700;top:25px;left:28px;display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid #71d5ba;border-radius:50%;color:#83e6cb;background:#071719;font:600 16px monospace}.brand div{display:flex;flex-direction:column}.brand strong{font-size:15px}.brand small{margin-top:5px;color:#809592;font:8px monospace;letter-spacing:.13em;text-transform:uppercase}.rail{position:absolute;z-index:700;left:23px;top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:9px}.rail button{width:76px;height:63px;border:1px solid rgba(210,235,230,.18);clip-path:polygon(25% 0,75% 0,100% 24%,100% 76%,75% 100%,25% 100%,0 76%,0 24%);color:#b8c8c5;background:rgba(7,19,21,.88);cursor:pointer;transition:.25s}.rail i,.rail span{display:block}.rail i{font:normal 18px monospace}.rail span{margin-top:5px;font:8px monospace;text-transform:uppercase}.rail button:hover,.rail button.active{color:#071411;background:#86e3c8;transform:translateX(6px)}.rail .tour{margin-top:6px;color:#ffd29a;border-color:rgba(223,157,78,.42)}.rail .tour.active{color:#101515;background:#e4a55d}.story{position:absolute;z-index:700;left:124px;bottom:54px;width:min(490px,calc(100vw - 170px));padding:24px 26px;border-left:2px solid #76ddbe;background:linear-gradient(90deg,rgba(5,16,18,.92),rgba(5,16,18,.3));backdrop-filter:blur(9px);animation:enter .45s ease}@keyframes enter{from{opacity:0;transform:translateY(12px)}}.story p{margin:0 0 10px;color:#76ddbe;font:8px monospace;letter-spacing:.14em;text-transform:uppercase}.story h1{margin:0 0 10px;font-size:clamp(30px,3.8vw,56px);line-height:.98;letter-spacing:-.055em;font-weight:520}.story span{display:block;color:#abbcb9;font-size:12px;line-height:1.55}.progress{height:2px;margin-top:18px;background:#ffffff22}.progress i{display:block;height:100%;background:linear-gradient(90deg,#76ddbe,#e5a65d);transition:.5s}.legend{position:absolute;z-index:700;right:31px;bottom:32px;width:190px;padding:14px;border:1px solid #ffffff24;border-radius:10px;background:#071214d9}.legend strong{display:block;margin-bottom:9px;color:#bdcdca;font:8px monospace;text-transform:uppercase}.legend i{display:block;height:7px;border-radius:4px;background:linear-gradient(90deg,#265e78,#36a99a,#eed45e,#ef7a34,#b62838)}.legend.uncertainty i{background:linear-gradient(90deg,#245f99,#38afaf,#dec649,#de623d,#9b256e)}.legend div{display:flex;justify-content:space-between;margin-top:5px;color:#718784;font:7px monospace}.coords{position:absolute;z-index:700;left:124px;top:34px;color:#72d9bc;font:9px monospace}.classic{position:absolute;z-index:700;right:28px;top:27px;padding:11px 14px;border:1px solid #ffffff28;border-radius:9px;color:#becdca;background:#071214c9;font:9px monospace;text-transform:uppercase;text-decoration:none}.mine{padding:8px 11px!important;border:1px solid #ffffffcc!important;border-radius:7px!important;color:#fff!important;background:#591a12f2!important;box-shadow:0 8px 24px #0007!important;font:11px monospace!important}.mine strong{display:block;font-size:12px}.mine small{display:block;margin-top:3px;color:#ffc8a9;font-size:8px}.mine:before{border-top-color:#591a12f2!important}.leaflet-control-zoom a{color:#e2ecea!important;background:#071214dc!important;border-color:#ffffff24!important}.leaflet-control-scale-line{color:#d6e1df!important;border-color:#d6e1df!important;background:#07121499!important}.leaflet-control-attribution{color:#748683!important;background:#071214bb!important}.leaflet-control-attribution a{color:#9aaba8!important}
@media(max-width:700px){.brand{left:14px;top:13px}.brand small,.coords,.legend{display:none}.classic{right:12px;top:13px}.rail{left:9px;top:auto;bottom:15px;transform:none;flex-direction:row;max-width:calc(100vw - 18px);overflow:auto}.rail button{flex:0 0 58px;width:58px;height:48px;clip-path:none;border-radius:8px}.rail button:hover,.rail button.active{transform:translateY(-3px)}.rail i{font-size:13px}.rail span{font-size:7px}.story{left:14px;bottom:84px;width:calc(100vw - 28px)}.story h1{font-size:34px}}
</style></head><body><div id="map"></div><div class="shade"></div><header class="brand"><span class="mark">G</span><div><strong>GeoHybridGNN</strong><small>Global research atlas · v2</small></div></header><nav class="rail" id="rail"></nav><section class="story" id="story"></section><aside class="legend" id="legend"><strong>Prospectivity probability</strong><i></i><div><span>Low</span><span>High</span></div></aside><div class="coords" id="coords">29.13° N · 62.03° E</div><a class="classic" href="/GeoHybridGNN/">Classic explorer ↗</a>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const root='/GeoHybridGNN/',bounds=[[25.984817,59.999735],[32.000057,68.003885]];
const scenes=[['globe','◎','Globe','Global context','Begin with the regional position of Pakistan and the Tethyan metallogenic domain.'],['study','⌖','Study','Western Chagai Belt','Move into the 30 m analysis grid covering the western Chagai porphyry copper belt.'],['evidence','≋','Evidence','Geological evidence','Read faults, tectonic units, lithology and known copper occurrences together.'],['prediction','◈','Prediction','Prospectivity','Explore the ensemble-mean probability surface produced by GeoHybridGNN.'],['uncertainty','◌','Uncertainty','Prediction confidence','Inspect fold-wise variability to distinguish stable targets from uncertain areas.'],['targets','◆','Targets','Known Cu–Au mines','Finish at Reko Diq and Saindak, shown as persistent, readable reference labels.']];
const map=L.map('map',{zoomControl:false,minZoom:2,maxZoom:12,worldCopyJump:true}).setView([24,64],2);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri · Data © OpenStreetMap',maxZoom:19}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{attribution:'© CARTO',maxZoom:19}).addTo(map);L.control.zoom({position:'topright'}).addTo(map);L.control.scale({imperial:false,position:'bottomright'}).addTo(map);
const layers={prediction:L.imageOverlay(root+'data/prospectivity.png',bounds,{opacity:.83}),uncertainty:L.imageOverlay(root+'data/uncertainty.png',bounds,{opacity:.86}),geology:L.imageOverlay(root+'data/lithology-overlay.png',bounds,{opacity:.78})};
async function geo(name,file,options){try{const r=await fetch(root+'data/'+file);layers[name]=L.geoJSON(await r.json(),options)}catch(e){console.warn(name,e)}}Promise.all([geo('faults','faults.geojson',{style:{color:'#ff7969',weight:1.4,opacity:.95}}),geo('tectonics','tectonics.geojson',{style:{color:'#efbd77',weight:1.2,opacity:.8,fillOpacity:0}}),geo('boundary','pakistan.geojson',{style:{color:'#f1f5f4',weight:1.5,opacity:.8,fillOpacity:0}}),geo('copper','copper.geojson',{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#fff',weight:1.2,fillColor:'#ef634f',fillOpacity:1})})]);
[[29.1333,62.0333,'Reko Diq','Cu–Au mine'],[29.27039,61.56389,'Saindak','Cu–Au mine']].forEach(s=>L.circleMarker([s[0],s[1]],{radius:8,color:'#fff',weight:2.5,fillColor:'#ff674f',fillOpacity:1}).bindTooltip('<strong>'+s[2]+'</strong><small>'+s[3]+'</small>',{permanent:true,direction:'top',offset:[0,-11],className:'mine'}).addTo(map));
let current='globe',tour=false,timers=[];const rail=document.querySelector('#rail'),story=document.querySelector('#story'),legend=document.querySelector('#legend');rail.innerHTML=scenes.map(s=>'<button data-scene="'+s[0]+'"><i>'+s[1]+'</i><span>'+s[2]+'</span></button>').join('')+'<button class="tour" id="tour"><i>▶</i><span>Tour</span></button>';
function show(key){current=key;Object.values(layers).forEach(l=>map.hasLayer(l)&&map.removeLayer(l));const add=(...n)=>n.forEach(x=>layers[x]&&layers[x].addTo(map));if(key==='globe')map.flyTo([24,64],2,{duration:1.7});if(key==='study'){add('boundary');map.flyToBounds(bounds,{padding:[65,65],duration:1.7})}if(key==='evidence'){add('geology','tectonics','faults','boundary','copper');map.flyToBounds(bounds,{padding:[45,45],duration:1.7})}if(key==='prediction'){add('prediction','faults','boundary','copper');map.flyToBounds(bounds,{padding:[45,45],duration:1.7})}if(key==='uncertainty'){add('uncertainty','faults','boundary','copper');map.flyToBounds(bounds,{padding:[45,45],duration:1.7})}if(key==='targets'){add('prediction','faults','boundary','copper');map.flyTo([29.18,61.82],8,{duration:1.7})}const i=scenes.findIndex(s=>s[0]===key),s=scenes[i];story.style.animation='none';story.offsetHeight;story.style.animation='';story.innerHTML='<p>GeoHybridGNN / '+String(i+1).padStart(2,'0')+'</p><h1>'+s[3]+'</h1><span>'+s[4]+'</span><div class="progress"><i style="width:'+((i+1)/scenes.length*100)+'%"></i></div>';document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===key));legend.className='legend '+key;legend.querySelector('strong').textContent=key==='uncertainty'?'Prediction variability':'Prospectivity probability'}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{stop();show(b.dataset.scene)});function stop(){tour=false;timers.forEach(clearTimeout);timers=[];const b=document.querySelector('#tour');b.classList.remove('active');b.innerHTML='<i>▶</i><span>Tour</span>'}document.querySelector('#tour').onclick=()=>{if(tour)return stop();tour=true;const b=document.querySelector('#tour');b.classList.add('active');b.innerHTML='<i>Ⅱ</i><span>Pause</span>';scenes.forEach((s,i)=>timers.push(setTimeout(()=>{show(s[0]);if(i===scenes.length-1)stop()},i*3400)))};map.on('mousemove',e=>document.querySelector('#coords').textContent=e.latlng.lat.toFixed(3)+'° N · '+e.latlng.lng.toFixed(3)+'° E');show('globe');
</script></body></html>
